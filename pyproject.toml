[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-tiff-meta-reader"
version = "0.1.0"
description = "Cross-platform GUI for viewing and exporting Hydra SEM TIFF metadata"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "EMBL Imaging Centre"}]
dependencies = [
    "PySide6>=6.6",
    "squirrel @ git+https://github.com/embl-ic/squirrel.git@0.5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
hydra-tiff-meta-reader = "hydra_tiff_meta_reader.app:main"

[project.urls]
Repository = "https://github.com/embl-ic/hydra-tiff-meta-reader"

[tool.setuptools.packages.find]
where = ["src"]
